# k3d cluster config for the integrated local environment.
# Usage: k3d cluster create --config infra/k3d/local.yaml
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: hsailabs-local
servers: 1
agents: 2
registries:
  create:
    name: hsailabs-registry
    hostPort: "5050"
ports:
  - port: 8080:80
    nodeFilters: [loadbalancer]
  - port: 8443:443
    nodeFilters: [loadbalancer]
