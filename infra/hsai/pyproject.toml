[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hsai"
version = "0.1.0"
description = "HSAILabs cluster and workload console"
requires-python = ">=3.11"

[project.scripts]
hsai = "hsai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
