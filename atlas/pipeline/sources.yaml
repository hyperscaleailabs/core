# =============================================================================
# Agentic Atlas — source registry
# =============================================================================
# This is the developer-facing input to the ingestion pipeline. Add reference
# links here; on the next CI run, `ingest.py` will fetch anything new or changed
# (by content hash / ETag / declared version), plan an article, draft it, and
# open a pull request for review.
#
# An entry can be a bare URL string, or a mapping with optional overrides:
#   - url        (required)
#   - section    foundations|frameworks|patterns|production|comparisons|
#                case-studies|news|learning-paths   (else auto-classified)
#   - level      beginner|intermediate|advanced      (else auto-classified)
#   - title      human title override
#   - publisher  attribution
#   - license    license of the ORIGINAL material (for attribution)
#   - tags       [list]
#   - version    bump this to force reprocessing when the page updates
#                but its content hash wouldn't change enough to trip
#
# Adding a link here is the ONLY step required to queue new content.
# =============================================================================

sources:
  # ai-hyperswarm-proto-core: twice-daily whitepapers from the self-improving
  # swarm harness (lessons synthesized per governance block). Bump `version`
  # to force re-ingestion after notable new whitepapers land.
