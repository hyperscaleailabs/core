[project]
name = "asc-flink-job"
version = "0.2.0"
description = "Agent Simulation Control Plane — Flink failure-statistics job (reference + SQL)"
requires-python = ">=3.12"
dependencies = ["asc-telemetry", "pydantic>=2.6"]
# apache-flink (pyflink) is provided by the Flink runtime image, not installed for unit tests.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_flink"]
