[project]
name = "asc-simulation-orchestrator"
version = "0.2.0"
description = "Agent Simulation Control Plane — simulation orchestrator"
requires-python = ">=3.12"
dependencies = [
    "asc-domain",
    "asc-gate-engine",
    "asc-simulation-kernel",
    "asc-simulation-worker",
    "asc-telemetry",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_orchestrator"]
