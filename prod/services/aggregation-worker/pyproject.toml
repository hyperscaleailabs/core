[project]
name = "asc-aggregation-worker"
version = "0.2.0"
description = "Agent Simulation Control Plane - aggregation worker (metrics fallback)"
requires-python = ">=3.12"
dependencies = ["asc-domain", "asc-simulation-kernel", "asc-telemetry", "pydantic>=2.6"]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_aggregation"]
