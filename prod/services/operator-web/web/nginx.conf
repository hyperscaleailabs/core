server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config injected by the entrypoint (Grafana/Superset/control-api base URLs).
    location = /config.js {
        default_type application/javascript;
        alias /usr/share/nginx/html/config.js;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Same-origin proxy to control-api so the browser console avoids CORS in-cluster.
    location /api/ {
        proxy_pass http://control-api.platform.svc.cluster.local:8000/;
        proxy_set_header Host $host;
    }

    # FastAPI's docs page at /api/docs loads its definition from an absolute
    # "/openapi.json", which the "location /" fallback below answers with the
    # console's index.html - so Swagger renders "Unable to render this definition"
    # while the API itself is fine. Serve the real document at that path.
    location = /openapi.json {
        proxy_pass http://control-api.platform.svc.cluster.local:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # v0.1.0 clickable MVP kept as the design/interaction reference.
    location /mvp/ {
        alias /usr/share/nginx/html/mvp/;
        index index.html;
        try_files $uri $uri/ /mvp/index.html;
    }

    # Live console is the default.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
