[project]
name = "asc-mcp-simulator-proxy"
version = "0.2.0"
description = "Agent Simulation Control Plane - MCP simulator/proxy"
requires-python = ">=3.12"
dependencies = [
    "asc-domain",
    "asc-simulation-kernel",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_mcp_proxy"]
