[project]
name = "asc-control-api"
version = "0.2.0"
description = "Agent Simulation Control Plane - control API"
requires-python = ">=3.12"
dependencies = [
    "asc-domain",
    "asc-gate-engine",
    "asc-simulation-kernel",
    "asc-simulation-orchestrator",
    "asc-simulation-worker",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_control_api"]
