apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Lite overlay for 8 GB machines / ephemeral CI: same images as local, trimmed control-api limits.
resources:
  - ../../../base

images:
  - name: control-api
    newName: k3d-agentsim-registry:5001/control-api
    newTag: dev
  - name: mcp-simulator-proxy
    newName: k3d-agentsim-registry:5001/mcp-simulator-proxy
    newTag: dev
  - name: operator-web
    newName: k3d-agentsim-registry:5001/operator-web
    newTag: dev

patches:
  - target: { kind: Deployment, name: control-api }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
