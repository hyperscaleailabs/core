apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-web
  namespace: platform
  labels: { app: operator-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: operator-web }
  template:
    metadata:
      labels: { app: operator-web }
    spec:
      containers:
        - name: operator-web
          image: operator-web
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: asc-config }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: operator-web
  namespace: platform
spec:
  selector: { app: operator-web }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: operator-web
  namespace: platform
spec:
  rules:
    - host: operator.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: operator-web
                port:
                  number: 8080
