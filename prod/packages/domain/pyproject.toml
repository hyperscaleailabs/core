[project]
name = "asc-domain"
version = "0.2.0"
description = "Agent Simulation Control Plane — core domain contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_domain"]
