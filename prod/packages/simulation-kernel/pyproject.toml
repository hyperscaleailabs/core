[project]
name = "asc-simulation-kernel"
version = "0.2.0"
description = "Agent Simulation Control Plane - deterministic simulation kernel"
requires-python = ">=3.12"
dependencies = ["asc-domain", "pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_kernel"]
