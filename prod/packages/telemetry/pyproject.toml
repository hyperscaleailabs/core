[project]
name = "asc-telemetry"
version = "0.2.0"
description = "Agent Simulation Control Plane — telemetry envelope, adapters, redaction"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "opentelemetry-sdk>=1.20"]

[project.optional-dependencies]
# Kafka client is only needed by services that produce to the broker (installed in their images).
kafka = ["kafka-python>=2.0"]
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc_telemetry"]
