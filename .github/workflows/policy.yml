name: policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pii-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PII scan (working tree)
        run: bash tools/policy/check_pii.sh tree

      # The range is passed explicitly so CI scans exactly the pushed commits;
      # a local `make commit-identity` defaults to origin/main..HEAD. The body
      # lives in the script so it can be run before pushing.
      - name: PII scan (commit messages and authors)
        run: |
          set -euo pipefail
          range="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
          if git rev-list "$range" >/dev/null 2>&1; then
            bash tools/policy/check_commit_identity.sh "$range"
          else
            bash tools/policy/check_commit_identity.sh "${{ github.sha }}" -n 20
          fi

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: relative markdown links and anchors resolve
        run: bash tools/policy/check_links.sh

  # A gate is only worth what it costs to run before pushing. This job guards
  # the shape of the other gates: piped steps must set pipefail (GitHub's
  # default shell does not), module policy guards must live in a script rather
  # than inline YAML, and every module Makefile must expose `verify`.
  ci-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Workflow hygiene guards
        run: python tools/policy/check_ci_hygiene.py
