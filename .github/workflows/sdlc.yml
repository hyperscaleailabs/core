name: sdlc

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-discipline:
    runs-on: ubuntu-latest
    steps:
      - name: PR body follows the SDLC template
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          fail=0
          for h in "## Purpose" "## Tasks" "## Acceptance criteria" "## Evidence" "## Lessons learned"; do
            if ! grep -qF "$h" <<<"$BODY"; then
              echo "Missing required section: $h"; fail=1
            fi
          done
          if ! grep -qE '^\s*- \[[ x]\] ' <<<"$BODY"; then
            echo "Acceptance criteria must contain at least one checkbox item"; fail=1
          fi
          if grep -qE '^\s*- \[ \] \.\.\.' <<<"$BODY"; then
            echo "Placeholder acceptance criterion '- [ ] ...' must be replaced"; fail=1
          fi
          if ! grep -qiE '^\s*Horizon:\s*(short|mid|long)\s*$' <<<"$BODY"; then
            echo "Purpose must declare 'Horizon: short|mid|long' (see AXIS.md)"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "PR bodies must follow .github/PULL_REQUEST_TEMPLATE.md (see sdlc/LIFECYCLE.md)."
            exit 1
          fi
          echo "PR body OK"
