# Public target-shape example. Real target identities, addresses, users, and
# cluster membership live in HSAI's external inventory, never in this file.
targets:
  local:
    kind: k3d
    context: k3d-hyperswarm
    notes: CPU-only; pipeline smoke scale. See docs/local-k3s-macbook.md.

  gpu-server-example:
    kind: ssh
    host: server.example.invalid
    port: 22
    gpu: true
    provision: infra/hsai
    notes: example only; one server in a named HSAI cluster.

  gpu-cluster-example:
    kind: ssh-list
    hosts:
      - server.example.invalid
      - worker.example.invalid
    gpu: true
    notes: example only; first host is the server and remaining hosts are agents.
