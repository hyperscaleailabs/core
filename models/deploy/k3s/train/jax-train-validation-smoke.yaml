apiVersion: batch/v1
kind: Job
metadata:
  name: jax-train-validation-smoke
  namespace: hyperswarm-models
  labels:
    app.kubernetes.io/name: jax-train-validation-smoke
    app.kubernetes.io/part-of: hsai
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jax-train-validation-smoke
    spec:
      restartPolicy: Never
      containers:
        - name: train-validation
          image: HSAI_JAX_IMAGE
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
