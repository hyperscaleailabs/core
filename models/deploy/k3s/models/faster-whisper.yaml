# faster-whisper ASR server (CPU by default; see inference/faster-whisper).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faster-whisper
  namespace: hyperswarm-models
  labels:
    app: faster-whisper
    hyperswarm.ai/model: faster-whisper-small
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faster-whisper
  template:
    metadata:
      labels:
        app: faster-whisper
    spec:
      containers:
        - name: server
          # registry is configurable (repo policy, CI-guarded): override registry.local
          # via a kustomize `images:` transformer or sed at deploy time
          image: registry.local/faster-whisper-server:latest
          env:
            - name: WHISPER_MODEL
              value: Systran/faster-whisper-small
            - name: WHISPER_DEVICE
              value: cpu
            - name: WHISPER_COMPUTE_TYPE
              value: int8
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: faster-whisper
  namespace: hyperswarm-models
spec:
  type: NodePort
  selector:
    app: faster-whisper
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30802
